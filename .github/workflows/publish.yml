name: Publish to npm

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '10.11.0'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - name: Validate release version
        id: release
        run: |
          version="$(node -p "require('./packages/cli/package.json').version")"
          test "$(node -p "require('./packages/core/package.json').version")" = "${version}"
          test "$(node -p "require('./packages/web/package.json').version")" = "${version}"
          test "${GITHUB_REF_NAME}" = "v${version}"
          npm_tag=latest
          if [[ "${version}" == *-* ]]; then npm_tag=next; fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "npm-tag=${npm_tag}" >> "${GITHUB_OUTPUT}"

      - name: Build Web client
        run: pnpm --filter @depic/web build-client

      - name: Build packages
        run: pnpm build

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test:run

      - name: Pack release artifacts
        id: pack
        run: |
          release_dir="${RUNNER_TEMP}/depic-release"
          mkdir -p "${release_dir}"
          pnpm --dir packages/core pack --pack-destination "${release_dir}"
          pnpm --dir packages/web pack --pack-destination "${release_dir}"
          pnpm --dir packages/cli pack --pack-destination "${release_dir}"
          echo "dir=${release_dir}" >> "${GITHUB_OUTPUT}"

      - name: Verify packed files
        run: |
          release_dir="${{ steps.pack.outputs.dir }}"
          version="${{ steps.release.outputs.version }}"
          tar -tzf "${release_dir}/depic-core-${version}.tgz" | grep -qx 'package/dist/index.js'
          tar -tzf "${release_dir}/depic-web-${version}.tgz" | grep -qx 'package/dist/index.js'
          tar -tzf "${release_dir}/depic-web-${version}.tgz" | grep -qx 'package/dist-client/index.html'
          tar -tzf "${release_dir}/depic-cli-${version}.tgz" | grep -qx 'package/dist/cli.js'
          node packages/cli/dist/cli.js --help | grep -q 'depic impact'

      # 按依赖顺序发布：core → web → cli
      - name: Publish @depic/core
        run: >-
          npm publish
          "${{ steps.pack.outputs.dir }}/depic-core-${{ steps.release.outputs.version }}.tgz"
          --access public
          --tag "${{ steps.release.outputs.npm-tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @depic/web
        run: >-
          npm publish
          "${{ steps.pack.outputs.dir }}/depic-web-${{ steps.release.outputs.version }}.tgz"
          --access public
          --tag "${{ steps.release.outputs.npm-tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @depic/cli
        run: >-
          npm publish
          "${{ steps.pack.outputs.dir }}/depic-cli-${{ steps.release.outputs.version }}.tgz"
          --access public
          --tag "${{ steps.release.outputs.npm-tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
